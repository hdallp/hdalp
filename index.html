<!-- The one face the page needs above the fold, fetched before the CSS gets a
     chance to ask for it. Fonts are always fetched CORS, hence crossorigin. -->
<link rel="preload" href="site/assets/fontes/Bitroad/Bitroad-Regular.otf" as="font" type="font/otf" crossorigin>

<!-- Styles, in the order they read: the font files, the decisions, the ground, the
     content column, the work, the piece, the navigation, the pointer. -->

<body>

<!-- The piece. The frame is the stage, and it is fixed: the drawing stands still and
     the page moves over it, and it walks towards its own watermark as the work climbs.
     Being fixed, it is also the ground rather than the opening — so the work is on the
     first screen, and the drawing is behind it. The two names — frame and art — are the
     contract between this page and site/src/mask/mask.js. -->
<div class="frame" id="frame">
  <div class="art" id="art" role="img" aria-label="A máscara, desenhada linha a linha em retângulos arredondados"></div>
</div>

<!-- The navigation: a fixed rail on a wide screen, a stack in the flow on a phone.
     The mark is a file, not data, and the bars come from the ITEMS list at the top
     of site/src/scripts/aside.js. -->
<aside class="aside" id="aside" aria-label="Navegação do site">
  <img class="mark" src="site/assets/marca/HDALP-branco.svg" alt="HDALP" width="52" height="14">
</aside>

<!-- The site until the work arrives: the drawing, the navigation, and this line. -->
<section class="espera">
  <p>EM BREVE</p>
</section>

<!-- The work, parked.

     This is the folder component we have been building — the case and the four
     categories inside it. It is not deleted and it is not commented out, because it
     cannot be: the markup carries custom properties in style attributes (--tinta,
     --texto), and an HTML comment cannot contain a double hyphen. A template is the
     honest way to park markup — the browser parses it and renders none of it — so
     putting the work back is deleting one line above and one line below.

     It wants site/src/estilos/portfolio.css and site/src/scripts/abas.js, and both are
     still loaded: the script looks for .portfolio, finds none while this is parked, and
     quietly does nothing. -->
<template id="portfolio-parado">
<!-- The work, as a stack of folders: the dynamic from the folder lab
     (folder-effect-lab/index.html), ported. site/src/estilos/portfolio.css draws it
     and site/src/scripts/abas.js works it.

     The pile is two deep. The folder in front is the case: it is not filled, it is
     drawn — a stroke, with its name written on it — and the four categories live inside
     its drawer, so none of the work is on the page until the case is opened. Each of
     those four is a folder of its own, solid, with its own tab and its own drawer.

     The case has no tab. A tab is a fold, and a case is not folded: the label belongs
     on the cover, which is where it is, and its handle is the button beside it.

     The colours are the stylesheet's: the case is in ink, the four carry the palette.
     --tinta is the folder and --texto is what is read on it, both decided in
     site/src/estilos/portfolio.css and named in site/src/estilos/tokens.css.

     With the script, the case is the folder that opens on arrival. Without it every
     folder stays folded — that is the stylesheet, not this markup, so a scriptless page
     shows the case and its title, and nothing is lost.

     The four categories are placeholders: every name and every line inside them is
     standing in until the real work arrives. -->
