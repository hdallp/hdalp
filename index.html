<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em breve...</title>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet">

    <!-- favicon -->
    <link rel="icon" type="image/png" href="../LOGO.ico">

    <style>
        :root {
            --bg-dark: #0a0a0f;
            --text-main: #ffffff;
            --blob-purple: #6B46FF;
            --blob-cyan: #00F0FF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        /* ======== Blobs ======== */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -2;
            transition: all 1.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #blob-1 {
            top: -20vh;
            left: -20vw;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, var(--blob-purple) 0%, transparent 70%);
        }

        #blob-2 {
            bottom: -20vh;
            right: -20vw;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, var(--blob-cyan) 0%, transparent 70%);
        }

        /* ======== Noise Overlay ======== */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04;
            z-index: -1;
            pointer-events: none;
        }

        /* ======== Conteúdo Central ======== */
        .center-content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .center-content h1 {
            font-size: clamp(2rem, 5vw, 5rem);
            font-weight: 300;
            letter-spacing: 0.04em;
            color: var(--text-main);
            opacity: 0.85;
            animation: pulse-text 6s ease-in-out infinite;
            text-shadow: 0 0 60px rgba(255, 255, 255, 0.08);
        }

        .center-content h1 span {
            font-weight: 700;
        }

        @keyframes pulse-text {

            0%,
            100% {
                opacity: 0.7;
            }

            50% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <!-- Fundo Blobs -->
    <div id="blob-1" class="blob"></div>
    <div id="blob-2" class="blob"></div>

    <!-- Ruído -->
    <div class="noise-overlay"></div>

    <!-- Conteúdo -->
    <div class="center-content">
        <h1>Em <span>breve</span>...</h1>
    </div>

    <script>
        // ====================== ANIMAÇÃO DOS BLOBS (12s) ======================
        const b1 = document.getElementById('blob-1');
        const b2 = document.getElementById('blob-2');

        let phase = 0;
        const TOTAL_PHASES = 12;

        // Padrões de posição para os blobs — varredura contínua usando Lissajous
        function animateBlobs() {
            const t = (phase / TOTAL_PHASES) * Math.PI * 2;

            // Blob 1: movimento orgânico com seno/cosseno defasados
            const b1TranslateX = Math.sin(t) * 40;
            const b1TranslateY = Math.cos(t * 1.3) * 30;
            b1.style.transform = `translate(${b1TranslateX}vw, ${b1TranslateY}vh)`;

            // Blob 2: contraponto com fase invertida
            const b2TranslateX = Math.cos(t * 0.8) * -50;
            const b2TranslateY = Math.sin(t * 1.1) * 20;
            b2.style.transform = `translate(${b2TranslateX}vw, ${b2TranslateY}vh)`;

            // Hue rotate: ciclo de 0° a 360° ao longo das fases
            const hue = (phase / TOTAL_PHASES) * 360;
            b1.style.filter = `blur(120px) grayscale(0%) brightness(1) hue-rotate(${hue}deg)`;
            b2.style.filter = `blur(120px) grayscale(0%) brightness(1) hue-rotate(${hue * 1.5}deg)`;

            phase = (phase + 1) % TOTAL_PHASES;
        }

        // Primeira execução imediata (sem delay)
        animateBlobs();

        // Ciclo a cada 12 segundos
        setInterval(animateBlobs, 1000);
    </script>

</body>

</html>
