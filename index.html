<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⠋ Em breve...</title>
    <!-- favicon animado via canvas -->
    <link rel="icon" type="image/png" href="ICON.ico" id="favicon-link">

    <script>
        // ---------- Título animado (spinner Braille) ----------
        (function () {
            var frames = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];
            var idx = 0;
            function tick() {
                document.title = frames[idx] + ' Em breve...';
                idx = (idx + 1) % frames.length;
            }
            tick(); // executa imediatamente
            setInterval(tick, 120);
        })();

        // ---------- Favicon animado (círculo pixelado + dither, sincronizado com blobs) ----------
        // roda após DOM pronto pra garantir que blob-1 existe
        (function initFavicon() {
            var link = document.getElementById('favicon-link');
            var SIZE = 16; // grid pixelado
            var UPSCALE = 4; // 16×4 = 64px final

            var canvas = document.createElement('canvas');
            canvas.width = SIZE;
            canvas.height = SIZE;
            var ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;

            // cache do dither: só o pattern (threshold) — a cor é aplicada live
            var ditherMap = [];
            (function buildDither() {
                var cx = (SIZE - 1) / 2,
                    cy = (SIZE - 1) / 2,
                    r = (SIZE / 2) - 0.5;
                var nx = 0.7071,
                    ny = -0.7071; // luz da direita-cima
                var bayer = [
                    [0 / 4, 2 / 4],
                    [3 / 4, 1 / 4]
                ];
                for (var y = 0; y < SIZE; y++) {
                    ditherMap[y] = [];
                    for (var x = 0; x < SIZE; x++) {
                        var dx = x - cx,
                            dy = y - cy;
                        var inside = (dx * dx + dy * dy) <= (r * r);
                        if (!inside) { ditherMap[y][x] = 0; continue; }
                        var d = (dx * nx + dy * ny) / (r * 1.42);
                        var lightness = (d * 0.5 + 0.5);
                        var threshold = bayer[y & 1][x & 1];
                        ditherMap[y][x] = (lightness > threshold) ? 2 : 1;
                    }
                }
            })();

            var displayCanvas = document.createElement('canvas');
            displayCanvas.width = SIZE * UPSCALE;
            displayCanvas.height = SIZE * UPSCALE;
            var dctx = displayCanvas.getContext('2d');
            dctx.imageSmoothingEnabled = false;

            // helpers de cor
            function hexToRgb(hex) {
                var h = hex.replace('#', '');
                return {
                    r: parseInt(h.substring(0, 2), 16),
                    g: parseInt(h.substring(2, 4), 16),
                    b: parseInt(h.substring(4, 6), 16)
                };
            }

            function applyHueRotate(rgb, deg) {
                var rad = deg * Math.PI / 180;
                var cos = Math.cos(rad),
                    sin = Math.sin(rad);
                var rw = 0.213,
                    gw = 0.715,
                    bw = 0.072;
                var r = rgb.r / 255,
                    g = rgb.g / 255,
                    b = rgb.b / 255;
                var rr = r * (cos + rw * (1 - cos)) + g * (gw * (1 - cos) - bw * sin) + b * (bw * (1 - cos) + gw * sin);
                var gg = r * (rw * (1 - cos) + bw * sin) + g * (cos + gw * (1 - cos)) + b * (bw * (1 - cos) - rw * sin);
                var bb = r * (rw * (1 - cos) - gw * sin) + g * (gw * (1 - cos) + rw * sin) + b * (cos + bw * (1 - cos));
                return {
                    r: Math.max(0, Math.min(255, Math.round(rr * 255))),
                    g: Math.max(0, Math.min(255, Math.round(gg * 255))),
                    b: Math.max(0, Math.min(255, Math.round(bb * 255)))
                };
            }

            var baseRgb = hexToRgb('#6B46FF');

            function getHueDeg() {
                var b1 = document.getElementById('blob-1');
                if (!b1) return 0;
                var filter = window.getComputedStyle(b1).filter;
                var match = filter.match(/hue-rotate\(([\-\d.]+)deg\)/);
                return match ? parseFloat(match[1]) : 0;
            }

            function drawFavicon() {
                var hueDeg = getHueDeg();
                var currentRgb = applyHueRotate(baseRgb, hueDeg);

                ctx.clearRect(0, 0, SIZE, SIZE);
                var img = ctx.createImageData(SIZE, SIZE);
                var data = img.data;
                for (var y = 0; y < SIZE; y++) {
                    for (var x = 0; x < SIZE; x++) {
                        var i = (y * SIZE + x) * 4;
                        var m = ditherMap[y][x];
                        if (m === 0) {
                            data[i] = 0;
                            data[i + 1] = 0;
                            data[i + 2] = 0;
                            data[i + 3] = 0;
                        } else if (m === 1) {
                            data[i] = currentRgb.r;
                            data[i + 1] = currentRgb.g;
                            data[i + 2] = currentRgb.b;
                            data[i + 3] = 255;
                        } else {
                            // highlight: puxa levemente pro ciano (blob2), proporcional à distância do canto
                            var t = 0.35;
                            data[i] = Math.round(currentRgb.r + (0x00 - currentRgb.r) * t);
                            data[i + 1] = Math.round(currentRgb.g + (0xF0 - currentRgb.g) * t);
                            data[i + 2] = Math.round(currentRgb.b + (0xFF - currentRgb.b) * t);
                            data[i + 3] = 255;
                        }
                    }
                }
                ctx.putImageData(img, 0, 0);

                dctx.clearRect(0, 0, SIZE * UPSCALE, SIZE * UPSCALE);
                dctx.drawImage(canvas, 0, 0, SIZE * UPSCALE, SIZE * UPSCALE);
                link.href = displayCanvas.toDataURL('image/png');
            }

            // adia o start pra garantir que o DOM tá pronto
            function start() {
                drawFavicon();
                setInterval(drawFavicon, 120);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', start);
            } else {
                start();
            }
        })();
    </script>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet">



    <style>
        :root {
            --bg-dark: #0a0a0f;
            --text-main: #ffffff;
            --blob-purple: #6B46FF;
            --blob-cyan: #00F0FF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -2;
        }

        #blob-1 {
            top: -20vh;
            left: -20vw;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, var(--blob-purple) 0%, transparent 70%);
        }

        #blob-2 {
            bottom: -20vh;
            right: -20vw;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, var(--blob-cyan) 0%, transparent 70%);
        }

        #noise-canvas,
        #dither-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
        }

        #noise-canvas {
            opacity: 0.055;
        }

        #dither-canvas {
            opacity: 0.025;
        }

        .center-content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .center-content h1 {
            font-size: clamp(2rem, 5vw, 5rem);
            font-weight: 300;
            letter-spacing: 0.04em;
            color: var(--text-main);
            opacity: 0.85;
            text-shadow: 0 0 60px rgba(255, 255, 255, 0.08);
        }

        .center-content h1 span {
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div id="blob-1" class="blob"></div>
    <div id="blob-2" class="blob"></div>
    <canvas id="noise-canvas"></canvas>
    <canvas id="dither-canvas"></canvas>
    <div class="center-content">
        <h1>Em <span>breve</span>™</h1>
    </div>
    <script>
        // ------------------- Noise & Dither -------------------
        (function () {
            var noise = document.getElementById('noise-canvas');
            var TILE = 256; noise.width = TILE; noise.height = TILE;
            var ctx = noise.getContext('2d');
            var img = ctx.createImageData(TILE, TILE);
            for (var i = 0; i < img.data.length; i += 4) {
                var v = Math.random() * 255 | 0;
                img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v; img.data[i + 3] = 255;
            }
            ctx.putImageData(img, 0, 0);
            var display = document.createElement('canvas');
            display.style.cssText = noise.style.cssText;
            display.style.position = 'fixed';
            display.style.top = '0';
            display.style.left = '0';
            display.style.width = '100vw';
            display.style.height = '100vh';
            display.style.zIndex = '-1';
            display.style.pointerEvents = 'none';
            display.style.opacity = '0.055';
            noise.replaceWith(display);
            function draw() {
                display.width = window.innerWidth;
                display.height = window.innerHeight;
                var dctx = display.getContext('2d');
                var pattern = dctx.createPattern(noise, 'repeat');
                dctx.fillStyle = pattern;
                dctx.fillRect(0, 0, display.width, display.height);
            }
            draw();
            window.addEventListener('resize', draw);
        })();

        (function () {
            var dither = document.getElementById('dither-canvas');
            var DTILE = 128; dither.width = DTILE; dither.height = DTILE;
            var ctx = dither.getContext('2d');
            var img = ctx.createImageData(DTILE, DTILE);
            for (var i = 0; i < img.data.length; i += 4) {
                var v = Math.random() * 255 | 0;
                img.data[i] = v * 0.6 | 0;
                img.data[i + 1] = v * 0.7 | 0;
                img.data[i + 2] = v;
                img.data[i + 3] = 255;
            }
            ctx.putImageData(img, 0, 0);
            var display = document.createElement('canvas');
            display.style.cssText = dither.style.cssText;
            display.style.position = 'fixed';
            display.style.top = '0';
            display.style.left = '0';
            display.style.width = '100vw';
            display.style.height = '100vh';
            display.style.zIndex = '-1';
            display.style.pointerEvents = 'none';
            display.style.opacity = '0.022';
            dither.replaceWith(display);
            function draw() {
                display.width = window.innerWidth;
                display.height = window.innerHeight;
                var dctx = display.getContext('2d');
                var pat = dctx.createPattern(dither, 'repeat');
                dctx.fillStyle = pat;
                dctx.fillRect(0, 0, display.width, display.height);
            }
            draw();
            window.addEventListener('resize', draw);
        })();

        // ------------------- Blobs animation -------------------
        (function () {
            var b1 = document.getElementById('blob-1');
            var b2 = document.getElementById('blob-2');
            var MOVE_SPEED = 0.1,
                AMPLITUDE_X = 25,
                AMPLITUDE_Y = 35,
                HUE_SPEED = 4,
                HUE_BLOB2_OFFSET = 60,
                VARIATION_SPEED = 0.04,
                VARIATION_RANGE = 0.35;
            var t0 = performance.now() * 0.001;
            function smoothRandom(t, key) {
                var seed = key.split('').reduce(function (a, c) { return a + c.charCodeAt(0); }, 0) * 0.001;
                var f1 = Math.sin(t * 0.137 + seed) * 0.5 + 0.5;
                var f2 = Math.cos(t * 0.079 + seed * 1.7) * 0.5 + 0.5;
                var f3 = Math.sin(t * 0.053 + seed * 3.1);
                return (f1 + f2 + f3) / 3;
            }
            function animateBlobs() {
                var t = performance.now() * 0.001 - t0;
                var v1 = smoothRandom(t * VARIATION_SPEED, 'b1fx') * VARIATION_RANGE * 2 - VARIATION_RANGE;
                var v2 = smoothRandom(t * VARIATION_SPEED, 'b1fy') * VARIATION_RANGE * 2 - VARIATION_RANGE;
                var v3 = smoothRandom(t * VARIATION_SPEED, 'b2fx') * VARIATION_RANGE * 2 - VARIATION_RANGE;
                var v4 = smoothRandom(t * VARIATION_SPEED, 'b2fy') * VARIATION_RANGE * 2 - VARIATION_RANGE;
                var f1 = 1.0 + v1,
                    f2 = 1.3 + v2,
                    f3 = 0.8 + v3,
                    f4 = 1.1 + v4;
                b1.style.transform = 'translate(' + Math.sin(t * MOVE_SPEED * f1) * AMPLITUDE_X + 'vw,' + Math.cos(t * MOVE_SPEED * f2) * AMPLITUDE_Y + 'vh)';
                b2.style.transform = 'translate(' + Math.cos(t * MOVE_SPEED * f3) * -AMPLITUDE_X + 'vw,' + Math.sin(t * MOVE_SPEED * f4) * AMPLITUDE_Y + 'vh)';
                var hue1 = (t * HUE_SPEED) % 360;
                var hue2 = (hue1 + HUE_BLOB2_OFFSET) % 360;
                b1.style.filter = 'blur(120px) brightness(1) hue-rotate(' + hue1 + 'deg)';
                b2.style.filter = 'blur(120px) brightness(1) hue-rotate(' + hue2 + 'deg)';
                requestAnimationFrame(animateBlobs);
            }
            requestAnimationFrame(animateBlobs);
        })();
    </script>
</body>

</html>
