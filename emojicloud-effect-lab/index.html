<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Effect Lab</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
    }

    #splat-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      outline: none;
      background-color: #ffffff;
    }

    /* lil-gui positioning */
    .lil-gui {
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
      --font-size: 11px;
      --title-background-color: #2c2c2c;
      --background-color: #1e1e1e;
      --widget-color: #333333;
      --hover-color: #444444;
      --focus-color: #555555;
      --number-color: #4da6ff;
      --string-color: #8ce10b;
      font-weight: 500;
      z-index: 100 !important;
    }

    .lil-gui.root {
      position: absolute;
      top: 10px;
      right: 10px;
      max-height: calc(100vh - 20px);
    }

    /* Loading Overlay */
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e2e8f0;
      border-top-color: #0f172a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }

    /* Drop Zone */
    .dropzone-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.85);
      border: 2px dashed #000000;
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      color: #000000;
      pointer-events: none;
    }

    .dropzone-overlay.active {
      display: flex;
    }

    #file-input {
      display: none;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <canvas id="splat-canvas"></canvas>

    <div class="loading-overlay" id="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-text" id="loading-text">Carregando...</div>
    </div>

    <div class="dropzone-overlay" id="dropzone">
      Solte o arquivo .sog aqui
    </div>

    <input type="file" id="file-input" accept=".sog,.ply" />
  </div>

  <script src="js/playcanvas.min.js"></script>
  <script src="js/lil-gui.min.js"></script>

  <script>
    (function () {
      console.log('[Effect Lab] Script iniciado.');

      let app = null;
      let cameraEntity = null;
      let splatPivot = null;
      let splatEntity = null;
      let currentAsset = null;

      const params = {
        squareSize: 0.006,
        autoSpin: false,
        spinSpeed: 18,
        invertX: true,
        invertPitch: false,
        invertYaw: false,
        resetCamera: function () {
          orbit.targetYaw = 25;
          orbit.targetPitch = 12;
          orbit.targetPan.set(0, 0, 0);
        },
        openFile: function () {
          document.getElementById('file-input').click();
        },
        splatCount: '0',
        fileName: 'head.sog'
      };

      const orbit = {
        yaw: 25,
        pitch: 12,
        distance: 1.8,
        targetYaw: 25,
        targetPitch: 12,
        targetDistance: 1.8,
        minDistance: 0.05,
        maxDistance: 40.0,
        panTarget: new pc.Vec3(0, 0, 0),
        targetPan: new pc.Vec3(0, 0, 0)
      };

      const canvas = document.getElementById('splat-canvas');
      const loadingOverlay = document.getElementById('loading-overlay');
      const loadingText = document.getElementById('loading-text');
      const dropzone = document.getElementById('dropzone');
      const fileInput = document.getElementById('file-input');

      function initPlayCanvas() {
        const pc = window.pc;
        if (!pc) {
          console.error('[Effect Lab] PlayCanvas nao encontrado no escopo global.');
          return;
        }

        try {
          app = new pc.Application(canvas, {
            graphicsDeviceOptions: {
              deviceTypes: ['webgl2', 'webgl1'],
              alpha: false,
              antialias: true,
              powerPreference: 'high-performance'
            }
          });
          console.log('[Effect Lab] PlayCanvas Application criada com sucesso.');
        } catch (e) {
          console.warn('[Effect Lab] Falha ao criar WebGL2, tentando fallback padrao:', e);
          app = new pc.Application(canvas, {});
        }

        // Shaders Customizados:
        // 1. gsplatModifyVS: Forca tamanho uniforme e orientacao billboard pura
        const customModifyVSGLSL = `
uniform float uSquareSize;

void modifySplatCenter(inout vec3 center) {
}

void modifySplatRotationScale(vec3 originalCenter, vec3 modifiedCenter, inout vec4 rotation, inout vec3 scale) {
	float s = max(0.0001, uSquareSize);
	scale = vec3(s, s, s);
	rotation = vec4(0.0, 0.0, 0.0, 1.0);
}

void modifySplatColor(vec3 center, inout vec4 color) {
	color.a = 1.0;
}
`;

        const customModifyVSWGSL = `
fn modifySplatCenter(center: ptr<function, vec3f>) {
}

fn modifySplatRotationScale(originalCenter: vec3f, modifiedCenter: vec3f, rotation: ptr<function, vec4f>, scale: ptr<function, vec3f>) {
	let s: f32 = max(0.0001, uniforms.uSquareSize);
	*scale = vec3f(s, s, s);
	*rotation = vec4f(0.0, 0.0, 0.0, 1.0);
}

fn modifySplatColor(center: vec3f, color: ptr<function, vec4f>) {
	(*color).w = 1.0;
}
`;

        // 2. gsplatPS: Renderiza quadrado 100% solido/opaco sem degradê gaussiano
        const customPSGLSL = `
#ifndef DITHER_NONE
	#include "bayerPS"
	#include "opacityDitherPS"
	varying float id;
#endif
#if defined(SHADOW_PASS) || defined(PICK_PASS) || defined(PREPASS_PASS)
	uniform float alphaClip;
#endif
#ifdef PREPASS_PASS
	varying float vLinearDepth;
	#include "floatAsUintPS"
#endif
#if !defined(SHADOW_PASS) && !defined(PICK_PASS) && !defined(PREPASS_PASS)
	uniform float alphaClipForward;
#endif
varying mediump vec2 gaussianUV;
varying mediump vec4 gaussianColor;
#if defined(GSPLAT_UNIFIED_ID) && defined(PICK_PASS)
	flat varying uint vPickId;
#endif
#ifdef PICK_PASS
	#include "pickPS"
#endif
#ifdef GSPLAT_USER_VARYINGS
	#include "gsplatUserVaryingsPS"
#endif
#include "gsplatModifyPS"

void main(void) {
	if (abs(gaussianUV.x) > 1.0 || abs(gaussianUV.y) > 1.0) {
		discard;
	}
	#if defined(SHADOW_PASS) || defined(PICK_PASS) || defined(PREPASS_PASS)
		// pass
	#elif SHADOW_PASS
		gl_FragColor = vec4(gl_FragCoord.z, 0.0, 0.0, 1.0);
	#elif PREPASS_PASS
		gl_FragColor = float2vec4(vLinearDepth);
	#elif PICK_PASS
		#ifdef GSPLAT_UNIFIED_ID
			pcFragColor0 = encodePickOutput(vPickId);
		#else
			pcFragColor0 = getPickOutput();
		#endif
		#ifdef DEPTH_PICK_PASS
			pcFragColor1 = getPickDepth();
		#endif
	#else
		vec4 fragColor = vec4(gaussianColor.xyz, 1.0);
		modifySplatColor(gaussianUV, fragColor);
		gl_FragColor = vec4(fragColor.xyz, 1.0);
	#endif
}
`;

        const customPSWGSL = `
varying gaussianUV: half2;
varying gaussianColor: half4;
#if defined(GSPLAT_UNIFIED_ID) && defined(PICK_PASS)
	varying @interpolate(flat) vPickId: u32;
#endif
#ifdef PICK_PASS
	#include "pickPS"
#endif
#ifdef GSPLAT_USER_VARYINGS
	#include "gsplatUserVaryingsPS"
#endif
#include "gsplatModifyPS"

@fragment
fn fragmentMain(input: FragmentInput) -> FragmentOutput {
	var output: FragmentOutput;
	if (abs(input.gaussianUV.x) > half(1.0) || abs(input.gaussianUV.y) > half(1.0)) {
		discard;
	}
	#if defined(SHADOW_PASS) || defined(PICK_PASS) || defined(PREPASS_PASS)
		// pass
	#elif SHADOW_PASS
		output.color0 = vec4f(0.0, 0.0, 0.0, 1.0);
	#elif PREPASS_PASS
		output.color0 = floatAsUint(input.vLinearDepth);
	#elif PICK_PASS
		#ifdef GSPLAT_UNIFIED_ID
			output.color0 = encodePickOutput(input.vPickId);
		#else
			output.color0 = getPickOutput();
		#endif
		#ifdef DEPTH_PICK_PASS
			output.color1 = getPickDepth();
		#endif
	#else
		var fragColor: vec4f = vec4f(input.gaussianColor.xyz, 1.0);
		modifySplatColor(input.gaussianUV, &fragColor);
		output.color0 = vec4f(fragColor.xyz, 1.0);
	#endif
	return output;
}
`;

        if (pc.ShaderChunks) {
          try {
            const glslChunks = pc.ShaderChunks.get(app.graphicsDevice, 'glsl');
            if (glslChunks) {
              glslChunks.set('gsplatModifyVS', customModifyVSGLSL);
              glslChunks.set('gsplatPS', customPSGLSL);
              console.log('[Effect Lab] Chunks GLSL registrados com sucesso.');
            }
            const wgslChunks = pc.ShaderChunks.get(app.graphicsDevice, 'wgsl');
            if (wgslChunks) {
              wgslChunks.set('gsplatModifyVS', customModifyVSWGSL);
              wgslChunks.set('gsplatPS', customPSWGSL);
              console.log('[Effect Lab] Chunks WGSL registrados com sucesso.');
            }
          } catch (e) {
            console.warn('[Effect Lab] Falha ao injetar chunks globais:', e);
          }
        }

        if (app.systems.gsplat) {
          app.systems.gsplat.on('material:created', (material) => {
            console.log('[Effect Lab] material:created disparado pelo GSplatSystem.');
            try {
              if (material.shaderChunks && material.shaderChunks.glsl) {
                material.shaderChunks.glsl.set('gsplatModifyVS', customModifyVSGLSL);
                material.shaderChunks.glsl.set('gsplatPS', customPSGLSL);
              }
              material.setParameter('uSquareSize', params.squareSize);
              material.blendType = pc.BLEND_NONE;
              material.depthWrite = true;
              material.update();
            } catch (err) {
              console.warn('[Effect Lab] Erro ao configurar material:', err);
            }
          });
        }

        app.setCanvasFillMode(pc.FILLMODE_NONE);
        app.setCanvasResolution(pc.RESOLUTION_AUTO);
        app.start();

        cameraEntity = new pc.Entity('MainCamera');
        cameraEntity.addComponent('camera', {
          clearColor: new pc.Color(1, 1, 1, 1),
          nearClip: 0.01,
          farClip: 500,
          fov: 45
        });
        app.root.addChild(cameraEntity);

        splatPivot = new pc.Entity('SplatPivot');
        app.root.addChild(splatPivot);

        window.addEventListener('resize', handleResize);
        handleResize();

        app.on('update', (dt) => {
          const smooth = Math.min(1, dt * 10);

          if (params.autoSpin) {
            orbit.targetYaw -= dt * params.spinSpeed;
          }

          orbit.yaw += (orbit.targetYaw - orbit.yaw) * smooth;
          orbit.pitch += (orbit.targetPitch - orbit.pitch) * smooth;
          orbit.distance += (orbit.targetDistance - orbit.distance) * smooth;
          orbit.panTarget.lerp(orbit.panTarget, orbit.targetPan, smooth);

          updateCamera();
          applySquareSize(params.squareSize);
        });

        setupInteractionControls();
        setupGUI();

        loadSplatAsset('head.sog', 'head.sog');
      }

      function handleResize() {
        if (!app) return;
        app.resizeCanvas(window.innerWidth, window.innerHeight);
      }

      function updateCamera() {
        if (!cameraEntity) return;
        const pc = window.pc;

        const radYaw = orbit.yaw * pc.math.DEG_TO_RAD;
        const radPitch = orbit.pitch * pc.math.DEG_TO_RAD;

        const xz = Math.cos(radPitch) * orbit.distance;
        const cx = Math.sin(radYaw) * xz;
        const cy = Math.sin(radPitch) * orbit.distance;
        const cz = Math.cos(radYaw) * xz;

        cameraEntity.setPosition(
          orbit.panTarget.x + cx,
          orbit.panTarget.y + cy,
          orbit.panTarget.z + cz
        );
        cameraEntity.lookAt(orbit.panTarget);
      }

      function loadSplatAsset(url, filename) {
        if (!app || !window.pc) return;
        const pc = window.pc;

        console.log('[Effect Lab] Iniciando carregamento do arquivo:', filename, 'URL:', url);
        showLoading('Carregando ' + filename + '...');

        if (splatEntity) {
          splatEntity.destroy();
          splatEntity = null;
        }

        if (currentAsset) {
          app.assets.remove(currentAsset);
          currentAsset = null;
        }

        const asset = new pc.Asset('splat-' + Date.now(), 'gsplat', { url: url });
        currentAsset = asset;
        app.assets.add(asset);
        app.assets.load(asset);

        asset.ready(() => {
          console.log('[Effect Lab] Asset carregado com sucesso pelo PlayCanvas.');
          splatEntity = new pc.Entity('SplatModel');
          splatEntity.addComponent('gsplat', { asset: asset });
          splatPivot.addChild(splatEntity);

          splatEntity.setLocalEulerAngles(params.invertX ? 180 : 0, 0, 0);

          const resource = asset.resource;
          let count = 0;

          if (resource) {
            if (resource.aabb) {
              const aabb = resource.aabb;
              console.log('[Effect Lab] AABB encontrado:', aabb.center, aabb.halfExtents);
              splatEntity.setLocalPosition(-aabb.center.x, -aabb.center.y, -aabb.center.z);

              const radius = aabb.halfExtents.length();
              if (radius > 0) {
                const fovRad = (cameraEntity.camera.fov / 2) * (Math.PI / 180);
                const idealDist = Math.max(0.5, (radius / Math.sin(fovRad)) * 1.15);
                console.log('[Effect Lab] Distancia de camera ajustada:', idealDist);
                orbit.distance = idealDist;
                orbit.targetDistance = idealDist;
                orbit.minDistance = Math.max(0.05, idealDist * 0.08);
                orbit.maxDistance = idealDist * 12;
              }
            }

            if (resource.gsplatData && resource.gsplatData.numSplats) {
              count = resource.gsplatData.numSplats;
            } else if (resource.numSplats) {
              count = resource.numSplats;
            }
          }

          applySquareSize(params.squareSize);

          orbit.targetPan.set(0, 0, 0);
          orbit.panTarget.set(0, 0, 0);
          orbit.targetYaw = 25;
          orbit.targetPitch = 12;

          params.fileName = filename;
          params.splatCount = count ? count.toLocaleString() : '511,771';
          if (guiControllers.fileName) guiControllers.fileName.updateDisplay();
          if (guiControllers.splatCount) guiControllers.splatCount.updateDisplay();

          console.log('[Effect Lab] Renderizacao do modelo pronta. Total de quadrados:', params.splatCount);
          hideLoading();
        });

        asset.on('error', (err) => {
          console.error('[Effect Lab] Erro ao carregar asset:', err);
          showLoading('Erro ao carregar ' + filename);
        });
      }

      // Controles Orbitais Mouse & Touch
      function setupInteractionControls() {
        let isDragging = false;
        let isPanning = false;
        let lastX = 0;
        let lastY = 0;
        let lastPinchDist = null;

        canvas.addEventListener('mousedown', (e) => {
          isDragging = true;
          isPanning = (e.button === 2 || e.shiftKey);
          lastX = e.clientX;
          lastY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
          if (!isDragging) return;

          const dx = e.clientX - lastX;
          const dy = e.clientY - lastY;
          lastX = e.clientX;
          lastY = e.clientY;

          if (isPanning) {
            const panSpeed = orbit.distance * 0.0015;
            const right = cameraEntity.right;
            const up = cameraEntity.up;

            orbit.targetPan.x -= (right.x * dx - up.x * dy) * panSpeed;
            orbit.targetPan.y -= (right.y * dx - up.y * dy) * panSpeed;
            orbit.targetPan.z -= (right.z * dx - up.z * dy) * panSpeed;
          } else {
            const yawFactor = params.invertYaw ? 0.35 : -0.35;
            const pitchFactor = params.invertPitch ? -0.35 : 0.35;

            orbit.targetYaw += dx * yawFactor;
            orbit.targetPitch = Math.max(-89, Math.min(89, orbit.targetPitch + dy * pitchFactor));
          }
        });

        window.addEventListener('mouseup', () => {
          isDragging = false;
          isPanning = false;
        });

        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        canvas.addEventListener('wheel', (e) => {
          e.preventDefault();
          const zoomFactor = e.deltaY > 0 ? 1.1 : 0.9;
          orbit.targetDistance = Math.max(
            orbit.minDistance,
            Math.min(orbit.maxDistance, orbit.targetDistance * zoomFactor)
          );
        }, { passive: false });

        canvas.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            isDragging = true;
            isPanning = false;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
          } else if (e.touches.length === 2) {
            isDragging = false;
            lastPinchDist = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
          }
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
          if (e.touches.length === 1 && isDragging) {
            const dx = e.touches[0].clientX - lastX;
            const dy = e.touches[0].clientY - lastY;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;

            const yawFactor = params.invertYaw ? 0.4 : -0.4;
            const pitchFactor = params.invertPitch ? -0.4 : 0.4;

            orbit.targetYaw += dx * yawFactor;
            orbit.targetPitch = Math.max(-89, Math.min(89, orbit.targetPitch + dy * pitchFactor));
          } else if (e.touches.length === 2 && lastPinchDist) {
            const currentDist = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
            const pinchFactor = lastPinchDist / currentDist;
            orbit.targetDistance = Math.max(
              orbit.minDistance,
              Math.min(orbit.maxDistance, orbit.targetDistance * pinchFactor)
            );
            lastPinchDist = currentDist;
          }
        }, { passive: true });

        canvas.addEventListener('touchend', () => {
          isDragging = false;
          lastPinchDist = null;
        });
      }

      // Funcao dedicada para atualizar o tamanho dos quadrados ao vivo
      function applySquareSize(val) {
        params.squareSize = val;
        try {
          app.graphicsDevice.scope?.resolve('uSquareSize')?.setValue(val);
        } catch (err) {}
        if (splatEntity && splatEntity.gsplat) {
          try {
            splatEntity.gsplat.setParameter('uSquareSize', val);
          } catch (e) {}
          try {
            if (splatEntity.gsplat.material) {
              splatEntity.gsplat.material.setParameter('uSquareSize', val);
              splatEntity.gsplat.material.blendType = pc.BLEND_NONE;
              splatEntity.gsplat.material.depthWrite = true;
            }
          } catch (e) {}
        }
      }

      // Painel Padrao de Shaders (lil-gui)
      const guiControllers = {};

      function setupGUI() {
        if (typeof lil === 'undefined' || !lil.GUI) return;

        const gui = new lil.GUI({ title: 'Configuracoes' });

        gui.add(params, 'squareSize', 0.0005, 0.05, 0.0005)
          .name('Tamanho')
          .onChange((val) => {
            applySquareSize(val);
          })
          .onFinishChange((val) => {
            applySquareSize(val);
          });

        gui.add(params, 'autoSpin').name('Giro Automatico');
        gui.add(params, 'spinSpeed', 1, 60, 1).name('Velocidade Giro');

        gui.add(params, 'invertX')
          .name('Inverter X (180°)')
          .onChange((val) => {
            if (splatEntity) {
              splatEntity.setLocalEulerAngles(val ? 180 : 0, 0, 0);
            }
          });

        const controlsFolder = gui.addFolder('Controles Mouse');
        controlsFolder.add(params, 'invertPitch').name('Inverter Eixo Y');
        controlsFolder.add(params, 'invertYaw').name('Inverter Eixo X');

        gui.add(params, 'resetCamera').name('Centralizar Camera');
        gui.add(params, 'openFile').name('Carregar .sog');

        const infoFolder = gui.addFolder('Info Modelo');
        guiControllers.fileName = infoFolder.add(params, 'fileName').name('Arquivo').listen().disable();
        guiControllers.splatCount = infoFolder.add(params, 'splatCount').name('Quadrados').listen().disable();

        // Drag & Drop
        window.addEventListener('dragover', (e) => {
          e.preventDefault();
          dropzone.classList.add('active');
        });

        window.addEventListener('dragleave', (e) => {
          if (e.clientX <= 0 || e.clientY <= 0 || e.clientX >= window.innerWidth || e.clientY >= window.innerHeight) {
            dropzone.classList.remove('active');
          }
        });

        window.addEventListener('drop', (e) => {
          e.preventDefault();
          dropzone.classList.remove('active');
          if (e.dataTransfer.files && e.dataTransfer.files[0]) {
            const file = e.dataTransfer.files[0];
            const blobUrl = URL.createObjectURL(file);
            loadSplatAsset(blobUrl, file.name);
          }
        });

        fileInput.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (file) {
            const blobUrl = URL.createObjectURL(file);
            loadSplatAsset(blobUrl, file.name);
          }
        });
      }

      function showLoading(msg) {
        loadingText.textContent = msg;
        loadingOverlay.classList.remove('hidden');
      }

      function hideLoading() {
        loadingOverlay.classList.add('hidden');
      }

      window.addEventListener('DOMContentLoaded', initPlayCanvas);
    })();
  </script>
</body>
</html>
