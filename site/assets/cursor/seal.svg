  <!-- The seal of a link: a disc with a soft scalloped edge and the arrow punched
       out of it. Drawn in white on purpose — the cursor blends by difference, so
       this reads dark over the paper and light over the black bars, and the arrow
       (a hole) always reads against it.

       To tune it: the two radii below are the crest and the trough of the edge,
       and the three points in the mask are the shaft and the two barbs of the
       arrow, which points up and to the right. -->
